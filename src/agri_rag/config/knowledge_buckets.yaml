B01_CROP_PROFILE:
  name: Crop Profile
  description: >
    Tên cây, tên khoa học, nhóm cây, chu kỳ sinh trưởng,
    giai đoạn phát triển và đặc tính cơ bản.

B02_WATER:
  name: Water and Irrigation
  description: >
    ET0, Kc, ETc, nhu cầu nước, tưới, stress nước,
    úng và thoát nước.

B03_NUTRITION:
  name: Nutrition
  description: >
    Bón lót, bón thúc, dinh dưỡng, phân bón,
    thời điểm bón và ảnh hưởng của thời tiết.

B04_PEST_DISEASE:
  name: Pest and Disease
  description: >
    Sâu bệnh, triệu chứng, điều kiện thuận lợi,
    IPM và biện pháp quản lý.

B05_WEATHER_CARE:
  name: Weather-aware Crop Care
  description: >
    Chăm sóc trước và sau mưa, nóng, gió,
    hạn, úng và các weather window.

B06_PESTICIDE_LEGAL:
  name: Pesticide Legal
  description: >
    Danh mục thuốc được phép, bị cấm,
    hoạt chất, cây trồng, đối tượng và PHI.

B07_GAP_SAFETY:
  name: GAP and Safety
  description: >
    VietGAP, an toàn thực phẩm, ghi chép,
    nước tưới, vật tư và truy xuất nguồn gốc.

B08_LOCAL:
  name: Local Knowledge
  description: >
    Tài liệu Bình Định cũ, Gia Lai hiện nay,
    Nam Trung Bộ và các mô hình địa phương.