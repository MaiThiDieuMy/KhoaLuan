registry_version: "2.0"

verified_on: "2026-09-05"

verification_policy:
  recheck_after_days: 30

  accepted_authorities:
    - NATIONAL_LEGAL_DATABASE
    - GOVERNMENT_PORTAL
    - PPD_OFFICIAL

  rules:
    - "Legal status must not be inferred from document keywords."
    - "Amended base documents must be used together with applicable amendments."
    - "Legal documents require re-verification when the verification period expires."
    - "A regulatory appendix inherits the legal context of its parent legal instrument."
    - "A base pesticide list must not be treated as a complete current list when an effective amendment exists."


