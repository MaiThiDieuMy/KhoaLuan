version: 1

study_scope:
  country: Vietnam
  primary_region: Binh_Dinh_Legacy
  current_administrative_region: Gia_Lai
  description: >
    Short-cycle vegetable decision-support study for the
    former Binh Dinh province, currently part of Gia Lai.

